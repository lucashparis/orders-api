x-verify-build: &verify-build
  context: .
  target: verify

x-database-url: &database-url postgresql://orders:orders@db:5432/orders

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - orders-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: *verify-build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: *database-url
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db-test:
    image: postgres:18.6-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_test
    ports:
      - "${DB_TEST_HOST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build: *verify-build
    profiles: ["tools"]
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: postgresql://orders:orders@db-test:5432/orders_test
    depends_on:
      db-test:
        condition: service_healthy

  demo:
    build: *verify-build
    profiles: ["tools"]
    command: ["npm", "run", "demo"]
    environment:
      API_URL: http://api:3000/graphql
    depends_on:
      api:
        condition: service_healthy

volumes:
  orders-data:
